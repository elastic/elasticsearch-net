<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elasticsearch .NET request converter - live</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.5 system-ui, sans-serif;
      display: grid;
      grid-template-rows: auto auto 1fr;
      height: 100vh;
    }
    header { padding: 12px 16px; border-bottom: 1px solid #8884; }
    header h1 { font-size: 16px; margin: 0 0 8px; }
    .config { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 12px; }
    .config label { display: flex; gap: 6px; align-items: center; }
    .config input { width: 28ch; font: inherit; padding: 2px 6px; }
    .status { padding: 6px 16px; font-size: 12px; border-bottom: 1px solid #8884; }
    .status.error { color: #c00; }
    main { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
    main > section { display: grid; grid-template-rows: auto 1fr; min-height: 0; border-right: 1px solid #8884; }
    main > section:last-child { border-right: none; }
    .pane-head { padding: 6px 16px; font-weight: 600; border-bottom: 1px solid #8884; display: flex; justify-content: space-between; align-items: center; }
    textarea, pre {
      margin: 0; padding: 12px 16px; border: 0; resize: none;
      font: 13px/1.45 ui-monospace, "Cascadia Code", Consolas, monospace;
      width: 100%; height: 100%; overflow: auto; background: transparent; color: inherit;
    }
    pre { white-space: pre-wrap; }
    select { font: inherit; }
  </style>
</head>
<body>
  <header>
    <h1>Elasticsearch .NET request converter (WebAssembly) - live</h1>
    <div class="config">
      <label>AppBundle main.mjs
        <input id="bundleUrl" value="../../../.artifacts/bin/RequestConverter.Wasm/release_browser-wasm/AppBundle/main.mjs" />
      </label>
      <label>Type style
        <select id="style">
          <option value="Simplified">Simplified</option>
          <option value="Fqn">Fqn</option>
          <option value="GlobalFqn">GlobalFqn</option>
        </select>
      </label>
      <label>Syntax
        <select id="syntax">
          <option value="object_initializer">Object initializer</option>
          <option value="descriptor">Descriptor (fluent)</option>
        </select>
      </label>
      <label>Client call
        <select id="clientCall">
          <option value="none" selected>None</option>
          <option value="statement">Statement</option>
          <option value="inline">Inline</option>
        </select>
      </label>
      <label>Call style
        <select id="callStyle">
          <option value="async" selected>Async</option>
          <option value="sync">Sync</option>
        </select>
      </label>
      <label>
        <input id="typedDocument" type="checkbox" />
        Strongly-typed document
      </label>
      <label>
        <input id="emitUsings" type="checkbox" checked />
        emit usings
      </label>
      <label>Document type
        <input id="documentType" value="MyDocument" style="width: 16ch;" />
      </label>
    </div>
  </header>

  <div id="status" class="status">Loading...</div>

  <main>
    <section>
      <div class="pane-head">Dev Console request</div>
      <textarea id="source" spellcheck="false">POST /my-index/_search
{
  "query": {
    "match_all": {}
  }
}</textarea>
    </section>
    <section>
      <div class="pane-head">
        <span>Generated C#</span>
        <span id="namespaces" style="font-weight: 400; font-size: 11px; opacity: 0.7;"></span>
      </div>
      <pre id="output"></pre>
    </section>
  </main>

  <script type="module" src="./harness.mjs"></script>
</body>
</html>
